name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version without a v prefix (must match buildspec.json)
        required: true
        type: string
      candidate:
        description: Release-candidate number
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse an existing release-candidate tag
        shell: bash
        run: |
          set -euo pipefail
          ! git ls-remote --exit-code --tags origin "refs/tags/v${{ inputs.version }}-rc.${{ inputs.candidate }}"
      - uses: ./.github/actions/build-release
        with:
          version: ${{ inputs.version }}
          output-directory: release-assets
      - name: Write release notes
        shell: bash
        run: |
          awk '/^## \['"${{ inputs.version }}"'\]/{found=1; next} found && /^## /{exit} found{print}' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Publish immutable prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}-rc.${{ inputs.candidate }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: false
          body_path: release-notes.md
          files: release-assets/*
