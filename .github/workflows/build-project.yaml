name: Build macOS plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Restore macOS OBS dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: macos-26-${{ runner.arch }}-obs-deps-${{ hashFiles('buildspec.json', 'cmake/macos/buildspec.cmake', 'cmake/common/buildspec_common.cmake') }}
          restore-keys: |
            macos-26-${{ runner.arch }}-obs-deps-
      - name: Configure
        run: cmake --preset macos-ci
      - name: Build
        run: cmake --build --preset macos-ci
      - name: Upload unsigned bundle
        uses: actions/upload-artifact@v4
        with:
          name: input-activity-macos-universal
          path: build_macos/rundir/RelWithDebInfo/input-activity.plugin
