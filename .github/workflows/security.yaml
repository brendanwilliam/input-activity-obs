name: Static security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          queries: security-extended
      - name: Restore macOS OBS dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: macos-26-${{ runner.arch }}-obs-deps-${{ hashFiles('buildspec.json', 'cmake/macos/buildspec.cmake', 'cmake/common/buildspec_common.cmake') }}
          restore-keys: |
            macos-26-${{ runner.arch }}-obs-deps-
      - run: cmake --preset macos-ci
      - run: cmake --build --preset macos-ci
      - uses: github/codeql-action/analyze@v3
