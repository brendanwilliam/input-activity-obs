name: Bug report
description: Report a reproducible problem with Input Activity.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include keystroke contents or other sensitive input data. Security issues belong in private vulnerability reporting."
  - type: input
    id: version
    attributes:
      label: Plugin and OBS version
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and hardware
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
